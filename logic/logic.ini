# ============================================================
# 逻辑类注册表 logic.ini
# 格式：逻辑ID = 类的全限定名（# 开头为注释）
# 槽里写 call 动作时可直接用 ID，或写 全限定类名#方法名
# ============================================================

# 内置演示逻辑（随主程序分发；示例地图“信号实验室”使用）
signallab = com.studio.logic.demo.SignalLabLogic

# ── 工程师接入步骤 ───────────────────────────────────────────
# 1) 写一个类：implements com.studio.flow.LogicHandler
#    （或提供 public 方法 任意名(FlowContext, SignalEvent)，用 ID#方法名 调用）
# 2) 编译到本目录的 classes/（按包结构）或打包成 jar 放本目录：
#      javac -encoding UTF-8 -cp ..\target\classes -d classes 你的类.java
# 3) 在此登记： mylogic = com.example.MyLogic
# 4) 编辑器里给节点/场景的槽写： 信号名 | call | | mylogic | 说明=...
# ─────────────────────────────────────────────────────────────
