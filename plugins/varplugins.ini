# ============================================================
# 变量插件注册表 —— 供信号/槽里的 @plugin(名字) 使用
#
#   名字 = 全限定类名
#
# 类必须实现 com.studio.flow.SlotPlugin（见 plugins/examples/VarPluginTemplate.java）。
# 编译产物放进 plugins/classes（或打成 jar 放 plugins/），改完本文件重启即可生效。
#
# 注意：编辑器自带的运算插件（add / sub / mul / div / mod / pow / min / max /
#       abs / round / floor / ceil / neg / set / inc / dec）无需在此登记，
#       脚本里直接写 @plugin(add) 就能用。
#
# 也可以不登记，直接在脚本里写全限定类名：slot = 点击 | @plugin(com.example.MyPlugin) | @var(x)
# ============================================================

# 示例（把示例模板编译到 plugins/classes 后取消注释）：
# 我的插件 = com.example.VarPluginTemplate
