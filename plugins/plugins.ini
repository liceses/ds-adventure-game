# ============================================================
# 插件注册表 plugins.ini
# 格式：事件ID = 插件类的全限定名（# 开头为注释）
# ============================================================

# 示例注册：内置插件（随主程序 classpath 分发，开箱即用）
minesweeper = com.studio.plugin.demo.MinesweeperPlugin
2048        = com.studio.plugin.demo.Game2048Plugin
savepanel   = com.studio.plugin.demo.SavePanelPlugin
breakout    = com.studio.plugin.demo.breakout.BreakoutPlugin
memory      = com.studio.plugin.demo.memory.MemoryPlugin

# ── 外部插件接入方法 ─────────────────────────────────────────
# 1) 新建一个 Java 类实现 com.studio.plugin.GamePlugin；
# 2) 编译（见本目录 README.txt 的 javac/mvn 两种方式），产物可以是：
#      · 把 *.class 放进  plugins/classes/…（与包结构一致）
#      · 或打成 xxx.jar 放进本目录
# 3) 在此文件中登记： 你的事件ID = 你的全限定类名
# 4) 重启播放器即可；地图中把场景 event / 节点 action=event 设为该事件ID。
# ─────────────────────────────────────────────────────────────

# 示例：把 plugins/examples/ClockDemoPlugin.java 编译进 plugins/classes 后，
# 取消下面一行的注释即可在事件中填写 clock 使用它：
# clock = com.studio.external.ClockDemoPlugin
